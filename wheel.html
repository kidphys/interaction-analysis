        body {

            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
        }

        emotion-ring-wheel {
            display: block;
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .component-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .component-header h1 {
            margin: 0;
            font-size: 28px;
            font-weight: 300;
        }



        .progress-container {
            margin: 20px;
            background-color: #e0e0e0;
            border-radius: 10px;
            height: 8px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 10px;
            transition: width 0.3s ease;
            width: 0%;
        }

        .chart-container {
            padding: 20px;
            min-height: 600px;
        }

        .status {
            text-align: center;
            margin: 20px;
            padding: 15px;
            border-radius: 8px;
            font-weight: 500;
        }

        .status.success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status.error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .data-info {
            margin: 20px;
            padding: 15px;
            background-color: #e7f3ff;
            border-radius: 8px;
            border-left: 4px solid #007bff;
        }
    </style>
</head>

            // Method to load data from CSV file
            async loadDataFromCSV(csvPath) {
                try {
                    const response = await fetch(csvPath);
                    const csvText = await response.text();
                    this.data = this.parseCSV(csvText);
                    this.showDataInfo();
                    this.renderInitialChart();
                    this.startAutomaticAnimation();
                } catch (error) {
                    this.showStatus('Error loading CSV file: ' + error.message, 'error');
                }
            }

            parseCSV(csvText) {
                const lines = csvText.split('\n');
                const headers = lines[0].split(',').map(h => h.trim());
                const data = [];

                for (let i = 1; i < lines.length; i++) {
                    if (lines[i].trim() === '') continue;

                    const values = lines[i].split(',').map(v => v.trim());
                    const row = {};

                    headers.forEach((header, index) => {
                        if (header === 'slide_order' || header === 'submission_count' ||
                            header === 'participant_count' || header === 'emotion_angle') {
                            row[header] = parseInt(values[index]) || 0;
                        } else {
                            row[header] = values[index] || '';
                        }
                    });

                    // Skip rows with missing critical data
                    if (row.slide_order && row.emotion_name && row.submission_count !== undefined) {
                        data.push(row);
                    }
                }

                return data;
            }

            showDataInfo() {
                if (!this.data || this.data.length === 0) return;

                const slides = [...new Set(this.data.map(d => d.slide_order))].sort((a, b) => a - b);
                const emotions = [...new Set(this.data.map(d => d.emotion_name))];
                const totalReactions = this.data.reduce((sum, d) => sum + d.submission_count, 0);

                const infoDiv = this.querySelector('#dataInfo');
                infoDiv.style.display = 'block';
                infoDiv.innerHTML = `
                    <strong>Data Overview:</strong><br>
                    📊 Slides: ${slides.length} (${slides[0]} - ${slides[slides.length - 1]})<br>
                    🎭 Emotions: ${emotions.length}<br>
                    👥 Total Reactions: ${totalReactions}
                `;
            }

            renderInitialChart() {
                if (!this.data || this.data.length === 0) {
                    this.showStatus('No data available to display', 'error');
                    return;
                }

                // Render empty chart initially
                this.renderChart([]);
            }

            startAnimation() {
                if (!this.data || this.data.length === 0) return;

                this.isAnimating = true;

                const slides = [...new Set(this.data.map(d => d.slide_order))].sort((a, b) => a - b);

                if (this.currentSlide >= slides.length) {
                    this.currentSlide = 0;
                }

                this.animateNextSlide(slides);
            }

            animateNextSlide(slides) {
                if (!this.isAnimating || this.currentSlide >= slides.length) {
                    if (this.currentSlide >= slides.length) {
                        this.completeAnimation();
                    }
                    return;
                }

                // Get data up to current slide
                const currentSlideNum = slides[this.currentSlide];
                const visibleSlides = slides.slice(0, this.currentSlide + 1);
                const visibleData = this.data.filter(d => visibleSlides.includes(d.slide_order));

                this.renderChart(visibleData);
                this.updateProgress(this.currentSlide + 1, slides.length);

                this.currentSlide++;

                // Schedule next slide
                this.animationFrameId = setTimeout(() => {
                    this.animateNextSlide(slides);
                }, this.animationSpeed); // Use consistent speed instead of dynamic speed
            }

            pauseAnimation() {
                this.isAnimating = false;
                if (this.animationFrameId) {
                    clearTimeout(this.animationFrameId);
                    this.animationFrameId = null;
                }
            }

            resetAnimation() {
                this.pauseAnimation();
                this.currentSlide = 0;
                this.updateProgress(0, 1);
                this.renderChart([]);
                this.clearStatus();
            }

            renderChart(dataToShow) {
                if (dataToShow.length === 0) {
                    // Show empty chart with layout
                    const fig = {
                        data: [],
                        layout: this.getChartLayout([])
                    };
                    Plotly.newPlot('chart', fig.data, fig.layout, { responsive: true });
                    return;
                }

                const slides = [...new Set(dataToShow.map(d => d.slide_order))].sort((a, b) => a - b);
                const maxCount = Math.max(...dataToShow.map(d => d.submission_count));
                const traces = [];

                slides.forEach(slideNum => {
                    const slideData = dataToShow.filter(d => d.slide_order === slideNum);

                    slideData.forEach(row => {
                        if (row.submission_count > 0) {
                            const intensity = 0.3 + (row.submission_count / maxCount) * 0.7;
                            const angularWidth = 72;

                            traces.push({
                                type: 'barpolar',
                                r: [1],
                                theta: [row.emotion_angle],
                                width: [angularWidth],
                                base: [slideNum - 0.5],
                                marker: {
                                    color: row.emotion_color,
                                    opacity: intensity,
                                    line: { color: 'white', width: 1 }
                                },
                                showlegend: false,
                                hovertemplate:
                                    `<b>Slide ${slideNum}</b><br>` +
                                    `Emotion: ${row.emotion_emoji} ${row.emotion_name}<br>` +
                                    `Reactions: ${row.submission_count}<br>` +
                                    `Participants: ${row.participant_count}<br>` +
                                    '<extra></extra>'
                            });
                        }
                    });
                });

                const layout = this.getChartLayout(slides);

                Plotly.newPlot('chart', traces, layout, { responsive: true });
            }

            getChartLayout(slides) {
                const maxSlides = Math.max(5, slides.length); // Ensure minimum range
                const angularWidth = 72;

                return {
                    title: {
                        text: '🎭 Emotion Rings - Progressive Animation',
                        font: { size: 20, color: '#333' }
                    },
                    polar: {
                        radialaxis: {
                            visible: true,
                            range: [0, maxSlides + 1],
                            showticklabels: true,
                            gridcolor: 'lightgray',
                            title: { text: 'Slides', font: { size: 12 } }
                        },
                        angularaxis: {
                            visible: true,
                            direction: 'clockwise',
                            tickmode: 'array',
                            tickvals: [0, 72, 144, 216, 288],
                            ticktext: [
                                '❤️ Love/Connection',
                                '👍 Positive/Approval',
                                '😆 Joy/Amusement',
                                '😮 Awe/Surprise',
                                '😢 Sad/Reflection'
                            ],
                            tickfont: { size: 11 }
                        }
                    },
                    margin: { l: 120, r: 120, t: 120, b: 120, pad: 10 },
                    width: 800,
                    height: 600,
                    paper_bgcolor: 'white',
                    plot_bgcolor: 'white'
                };
            }

            updateProgress(current, total) {
                const percentage = (current / total) * 100;
                this.querySelector('#progressBar').style.width = `${percentage}%`;
            }

            completeAnimation() {
                this.isAnimating = false;
                this.showStatus('✨ Ring building complete!', 'success');
            }

            showStatus(message, type = 'success') {
                const statusDiv = this.querySelector('#status');
                statusDiv.innerHTML = message;
                statusDiv.className = `status ${type}`;
                statusDiv.style.display = 'block';
            }

            clearStatus() {
                const statusDiv = this.querySelector('#status');
                statusDiv.style.display = 'none';
            }

            // Public methods for external use
            loadData(data) {
                this.data = data;
                this.showDataInfo();
                this.renderInitialChart();
                this.startAutomaticAnimation();
            }
        }
